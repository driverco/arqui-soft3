version: '3.8'

services:
  # Fares service - Pod 1
  fares-pod-1:
    build:
      context: .
      dockerfile: Dockerfile.fares
    ports:
      - "8001:8000"
    environment:
      - SERVICE_NAME=fares-pod-1
    container_name: fares-pod-1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Fares service - Pod 2
  fares-pod-2:
    build:
      context: .
      dockerfile: Dockerfile.fares
    ports:
      - "8002:8000"
    environment:
      - SERVICE_NAME=fares-pod-2
    container_name: fares-pod-2
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Fares service - Pod 3
  fares-pod-3:
    build:
      context: .
      dockerfile: Dockerfile.fares
    ports:
      - "8003:8000"
    environment:
      - SERVICE_NAME=fares-pod-3
    container_name: fares-pod-3
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Fares API - Gateway
  fares-api:
    build:
      context: .
      dockerfile: Dockerfile.faresApi
    ports:
      - "8010:8000"
    environment:
      - SERVICE_NAME=fares-api
    container_name: fares-api
    depends_on:
      - fares-pod-1
      - fares-pod-2
      - fares-pod-3
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # API Gateway
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile.apigateway
    ports:
      - "8000:8000"
    environment:
      - SERVICE_NAME=api-gateway
      - FARES_API_BASE_URL=http://fares-api:8000
    container_name: api-gateway
    depends_on:
      - fares-api
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Angular UI for API Gateway
  faresui:
    build:
      context: ./faresui
      dockerfile: Dockerfile
    ports:
      - "4200:4200"
    environment:
      - NODE_ENV=production
    container_name: faresui
    depends_on:
      - api-gateway

networks:
  default:
    name: arqui-soft3-network
